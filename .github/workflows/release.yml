name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-version:
    name: Check the tagged version
    runs-on: ubuntu-latest
    outputs:
      # "true" for a final version such as 1.2.3; pre-releases stop at TestPyPI.
      final: ${{ steps.check.outputs.final }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        name: Every package declares the tagged version and has a changelog entry for it
        run: python3 scripts/check_release_version.py "${GITHUB_REF_NAME}"

  quality:
    name: Quality gate
    needs: check-version
    # The whole CI workflow, including the build job that uploads the
    # distributions this run publishes. A tag on a red commit stops here.
    uses: ./.github/workflows/ci.yml

  # One job, and one deployment environment, per package: an index accepts a
  # pending trusted publisher for a single project name per environment. The
  # core goes first, so the product package never exists without its dependency.

  publish-testpypi-core:
    name: Publish cnovatech-sdk-core to TestPyPI
    needs: [check-version, quality]
    runs-on: ubuntu-latest
    environment:
      name: testpypi-core
      url: https://test.pypi.org/project/cnovatech-sdk-core/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - name: Keep the core distributions only
        run: mkdir core && mv dist/cnovatech_sdk_core-* core/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: core/
          attestations: true

  publish-testpypi:
    name: Publish cnovatech-datamarket to TestPyPI
    needs: [check-version, publish-testpypi-core]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/cnovatech-datamarket/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - name: Keep the datamarket distributions only
        run: mkdir datamarket && mv dist/cnovatech_datamarket-* datamarket/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: datamarket/
          attestations: true

  # Final versions only, after the same distributions reached TestPyPI, and
  # once a reviewer of the `pypi-core` and `pypi` environments approves.

  publish-pypi-core:
    name: Publish cnovatech-sdk-core to PyPI
    needs: [check-version, publish-testpypi]
    if: needs.check-version.outputs.final == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-core
      url: https://pypi.org/project/cnovatech-sdk-core/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - name: Keep the core distributions only
        run: mkdir core && mv dist/cnovatech_sdk_core-* core/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: core/
          attestations: true

  publish-pypi:
    name: Publish cnovatech-datamarket to PyPI
    needs: [check-version, publish-pypi-core]
    if: needs.check-version.outputs.final == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cnovatech-datamarket/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - name: Keep the datamarket distributions only
        run: mkdir datamarket && mv dist/cnovatech_datamarket-* datamarket/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: datamarket/
          attestations: true
