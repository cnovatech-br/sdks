name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Refuse to run if uv.lock is out of date with the manifests.
  UV_LOCKED: "1"

jobs:
  lint:
    name: Lint and boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: make lint
      - run: make boundary

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: make typecheck

  test:
    name: Test ${{ matrix.package }} on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        package: [core, datamarket-python]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-packages
      - run: uv run pytest --cov --cov-report=xml
        working-directory: ${{ matrix.package }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Export the runtime dependencies
        run: >
          uv export --all-packages --no-dev --no-emit-workspace --no-hashes
          --format requirements-txt --output-file requirements.txt
      - run: uvx pip-audit --requirement requirements.txt --no-deps
