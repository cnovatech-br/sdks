name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this whole workflow as its quality gate before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Refuse to run if uv.lock is out of date with the manifests.
  UV_LOCKED: "1"
  UV_VERSION: "0.13.6"

jobs:
  lint:
    name: Lint and boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages
      - run: make lint
      - run: make boundary

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages
      - run: make typecheck

  test:
    name: Test ${{ matrix.package }} on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        package: [core, datamarket-python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-packages
      - run: uv run pytest --cov
        working-directory: ${{ matrix.package }}

  build:
    name: Build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Build sdists and wheels
        run: |
          uv build --package cnovatech-sdk-core
          uv build --package cnovatech-datamarket
      - name: Check the metadata PyPI will render
        run: uvx twine check dist/*
      - name: Install the wheels into a clean environment and import them
        # Runs outside the checkout so the import can only come from the
        # installed wheels, not from src/. A broken namespace package or a
        # wheel without the version metadata fails here.
        run: |
          uv venv "${RUNNER_TEMP}/install-check"
          uv pip install --python "${RUNNER_TEMP}/install-check/bin/python" dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/install-check/bin/python" -I - <<'EOF'
          import cnovatech.datamarket as datamarket
          import cnovatech.sdk_core as sdk_core

          for module in (datamarket, sdk_core):
              assert module.__version__ != "0.0.0+unknown", f"{module.__name__} has no version metadata"
              print(f"{module.__name__} {module.__version__}")
          assert datamarket.DataMarket and datamarket.AsyncDataMarket
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Export the runtime dependencies
        run: >
          uv export --all-packages --no-dev --no-emit-workspace --no-hashes
          --format requirements-txt --output-file requirements.txt
      - run: uvx pip-audit --requirement requirements.txt --no-deps
