# Weekly update proposals for the GitHub Actions the workflows pin by commit
# and for the Python dependencies locked in uv.lock.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # These are published libraries: a release that the current range already
  # allows only moves uv.lock, so consumers keep the minimums declared in
  # pyproject.toml. A release outside the range (a new major) still opens a
  # pull request that widens the requirement.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
