[project]
name = "cnovatech-sdk-core"
version = "0.1.0.dev0"
description = "Shared HTTP transport, configuration, errors and pagination for the Cnovatech Python SDKs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Cnova Tech", email = "suporte@cnovatech.com.br" }]
keywords = ["cnovatech", "sdk", "http", "client"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]

[project.urls]
Homepage = "https://cnovatech.com.br"
Repository = "https://github.com/cnovatech-br/sdks"
Changelog = "https://github.com/cnovatech-br/sdks/blob/main/core/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

# `src/cnovatech/` has no __init__.py on purpose: it is a PEP 420 namespace
# shared with the product SDKs (`cnovatech.datamarket`, ...).
[tool.hatch.build.targets.wheel]
packages = ["src/cnovatech"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
mypy_path = "src:tests"
strict = true
warn_unreachable = true
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/cnovatech/sdk_core"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if sys.version_info",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
